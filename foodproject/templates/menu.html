<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f5f5f5;
        }

        /* Navbar */

        .navbar{
            background:linear-gradient(to right,#ff9800,#ff5722);
            padding:20px;
            color:white;
            text-align:center;
            font-size:32px;
            font-weight:bold;
            box-shadow:0px 3px 10px rgba(0,0,0,0.2);
        }

        /* Title */

        .title{
            text-align:center;
            margin:40px 0;
            font-size:45px;
            color:#333;
            text-transform:capitalize;
        }

        /* Container */

        .container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:30px;
            padding:20px 40px 60px;
        }

        /* Card */

        .card{
            width:300px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0px 5px 20px rgba(0,0,0,0.15);
            transition:0.4s;
        }

        .card:hover{
            transform:translateY(-10px) scale(1.03);
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .card-body{
            padding:18px;
        }

        .card-body h2{
            margin-bottom:10px;
            color:#222;
        }

        .description{
            color:#666;
            margin-bottom:10px;
        }

        .price{
            color:#ff5722;
            font-size:22px;
            font-weight:bold;
            margin:10px 0;
        }

        .rating{
            color:green;
            font-weight:bold;
            margin-bottom:10px;
        }

        .btn{
            display:inline-block;
            margin-top:10px;
            background:#28a745;
            color:white;
            padding:12px 22px;
            border-radius:30px;
            text-decoration:none;
            transition:0.3s;
        }

        .btn:hover{
            background:#218838;
        }

        /* Footer */

        .footer{
            background:#111;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <div class="navbar">
        🍔 FoodExpress Menu
    </div>

    <!-- Title -->

    <h1 class="title">
        {{ restaurant_name }} Menu
    </h1>

    <!-- Menu Container -->

    <div class="container">

        {% for food in foods %}

        <!-- Food Card -->

        <div class="card">

            <img src="{{ food.image }}">

            <div class="card-body">

                <h2>{{ food.name }}</h2>

                <p class="description">
                    Delicious and freshly prepared food
                </p>

                <p class="price">
                    {{ food.price }}
                </p>

                <p class="rating">
                    ⭐ 4.7
                </p>

                <a href="/cart/" class="btn">
                    Add To Cart
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

    <!-- Footer -->

    <div class="footer">
        © 2026 FoodExpress | All Rights Reserved
    </div>

</body>
</html>
