<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
        }

        .container{
            width:500px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#e23744;
            margin-bottom:20px;
        }

        input, textarea{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        .btn{
            width:100%;
            padding:15px;
            background:#e23744;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        .btn:hover{
            background:#c91f2f;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>📍 Delivery Address</h1>

    <form action="/payment/" method="POST">

        {% csrf_token %}

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="text" name="mobile" placeholder="Mobile Number" required>

        <textarea name="address" rows="4" placeholder="Delivery Address" required></textarea>

        <input type="text" name="city" placeholder="City" required>

        <input type="text" name="pincode" placeholder="Pincode" required>

        <button type="submit" class="btn">
            Proceed To Payment
        </button>

    </form>

</div>

</body>
</html>
