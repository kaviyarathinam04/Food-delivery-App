<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(rgba(0,0,0,0.5),
            rgba(0,0,0,0.5)),
            url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1470&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
        }

        .register-box{
            width:420px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.4);
            text-align:center;
        }

        .register-box h1{
            margin-bottom:25px;
            color:#e23744;
            font-size:40px;
        }

        .input-box{
            width:100%;
            padding:15px;
            margin:12px 0;
            border:none;
            border-radius:10px;
            background:#f1f1f1;
            font-size:16px;
        }

        .btn{
            width:100%;
            padding:15px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#e23744;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#c71f37;
        }

        .text{
            margin-top:20px;
            color:gray;
        }

        .text a{
            color:#e23744;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="register-box">

        <h1>🍕 Register</h1>

        <form action="/">

            <input type="text"
            placeholder="Enter Username"
            class="input-box">

            <input type="email"
            placeholder="Enter Email"
            class="input-box">

            <input type="password"
            placeholder="Enter Password"
            class="input-box">

            <input type="password"
            placeholder="Confirm Password"
            class="input-box">

            <button class="btn">
                Register
            </button>

        </form>

        <p class="text">
            Already have account?
            <a href="/login/">Login</a>
        </p>

    </div>

</body>
</html>
