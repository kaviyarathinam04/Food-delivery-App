<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
        }

        .container{
            width:500px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#e23744;
            margin-bottom:20px;
        }

        .option{
            margin:15px 0;
            font-size:20px;
        }

        .btn{
            width:100%;
            padding:15px;
            background:#e23744;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>💳 Select Payment Method</h1>

    <form action="/success/" method="POST">

        {% csrf_token %}

        <div class="option">
            <input type="radio" name="payment" required>
            UPI Payment
        </div>

        <div class="option">
            <input type="radio" name="payment">
            Debit Card
        </div>

        <div class="option">
            <input type="radio" name="payment">
            Credit Card
        </div>

        <div class="option">
            <input type="radio" name="payment">
            Cash On Delivery
        </div>

        <button type="submit" class="btn">
            Place Order
        </button>

    </form>

</div>

</body>
</html>
